# Jukeoke Studio: the Python engine that turns a song into a karaoke song.
# Runs on Windows with an NVIDIA GPU (CUDA 13.0 build of PyTorch, verified on an
# RTX 5070 Ti / sm_120). The player and the Mac build never use it.

[project]
name = "jukeoke-studio"
version = "0.1.0"
description = "Jukeoke Studio engine: stem separation, lyrics alignment, song-file writing"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Exact pins: the benchmarks in docs/benchmarks/ (separation.md, alignment.md,
    # analysis.md) were measured with exactly these versions.
    # -- separation
    "torch==2.14.1",
    "numpy==2.5.5",
    "soundfile==0.14.0",          # BSD-3; libsndfile 1.2.2 (LGPL-2.1, bundled DLL)
    "soxr==1.1.0",                # LGPL-2.1+ ; resampling (VHQ) only where a model needs it
    "einops==0.8.2",              # MIT
    "rotary-embedding-torch==0.9.2",  # MIT; RoFormer positions
    "demucs==4.1.0",              # MIT; HT-Demucs drums/vocals sub-models
    # -- lyrics, alignment, analysis (versions of the lyrics/alignment benchmark venv)
    "librosa==1.0.1",             # ISC; key detection (analyse.py), mel filter bank in tests
    "transformers==5.23.0",       # Apache-2.0; wav2vec2 CTC alignment model
    "huggingface-hub==2.4.0",     # Apache-2.0; pinned-revision model downloads
    "faster-whisper==1.2.1",      # MIT; transcription when no lyrics are given
    "ctranslate2==4.9.0",         # MIT; faster-whisper's runtime (CUDA 12 build)
    # CTranslate2 4.x needs CUDA 12 cuBLAS next to torch's CUDA 13 (DECISIONS D-54).
    "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32'",
    "av==19.0.2",                 # BSD-3-Clause (wheel bundles FFmpeg); lyrics tags in media files
    "mutagen==1.48.1",            # GPL-2.0-or-later; tags, embedded lyrics
    "regex==2026.11.15",          # Apache-2.0 AND CNRI-Python; grapheme clusters (\X)
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[project.scripts]
jukeoke-studio = "jukeoke_studio.__main__:main"

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jukeoke_studio*"]

[tool.uv]
# The Studio only ships for Windows x86-64 (docs/ARCHITECTURE.md section 5).
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gpu: needs a CUDA GPU and downloads model weights (run with -m gpu)",
]
addopts = "-m 'not gpu'"
