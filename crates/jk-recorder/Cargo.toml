[package]
name = "jk-recorder"
description = "Jukeoke system-audio recorder: ScreenCaptureKit (macOS 13+) and WASAPI loopback (Windows), lossless 32-bit float WAV / RF64"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# Recording sessions (src/session.rs): the session file and the per-song sidecars are
# JSON. Same versions as the app crate's.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The macOS backend is written against the objc2 family of crates. Every API used
# exists on macOS 13.0 (the owner's MacBook runs 13.6.9); see docs/MAC.md, section
# "ScreenCaptureKit on macOS 13". Versions are pinned to the current releases as of
# 2026-11-17 so `cargo check --target aarch64-apple-darwin -p jk-recorder` on Windows
# type-checks exactly what CI and scripts/build-mac.sh will compile.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-graphics = "0.3.2"

# The Windows backend (WASAPI loopback). `wasapi` and `windows` are the versions
# jk-engine already uses (wasapi 0.27 is built on windows 0.62), so the workspace
# compiles one copy of each.
[target.'cfg(windows)'.dependencies]
wasapi = "0.27"
# WinRT async operations (IAsyncOperation, AsyncStatus) for the media-player link;
# the version windows 0.62 itself depends on (it does not re-export the types).
windows-future = "0.3.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
# Foundation .. Storage_Streams: the media-player link (src/media/windows.rs) uses the
# WinRT Global System Media Transport Controls (Windows.Media.Control, Windows 10
# 1809+), activated through combase's RoGetActivationFactory; works on the GNU
# toolchain (windows-link raw-dylib imports).
features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
]

[[example]]
# macOS self-check: permission state + a 3-second capture. Builds (as a stub that
# explains itself) on every platform so `cargo build --examples` never breaks.
name = "sck_probe"
path = "examples/sck_probe.rs"
test = true   # run its unit tests (tone-frequency estimator) with `cargo test`

[[example]]
# Windows self-check and benchmark: plays a -60 dBFS test signal (997 Hz sine and
# a pseudo-random sequence) through the default device, records it via loopback
# and checks rate, length against elapsed time, dropouts and bit-transparency
# (docs/benchmarks/recorder.md). A stub that explains itself on other platforms.
name = "loopback_probe"
path = "examples/loopback_probe.rs"
test = true
