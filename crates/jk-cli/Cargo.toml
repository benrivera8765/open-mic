[package]
name = "jk-cli"
description = "jukeoke-cli: song-file info/verify/render/export, melody guide (guide add/show), demo song, playback and DSP benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "jukeoke-cli"
path = "src/main.rs"

[dependencies]
jk-dsp = { path = "../jk-dsp" }
jk-engine = { path = "../jk-engine" }
jk-format = { path = "../jk-format" }
# Work Order 2: `guide add/show` (the same builder and writer as the app).
jk-guide = { path = "../jk-guide" }
jk-pitch = { path = "../jk-pitch" }
jk-rubberband = { path = "../jk-rubberband" }
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"]
