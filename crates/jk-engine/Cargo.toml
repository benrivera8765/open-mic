[package]
name = "jk-engine"
description = "Jukeoke real-time player: .jksong stem streaming, render-ahead worker, device output (WASAPI / Core Audio), playback clock, offline export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jk-dsp = { path = "../jk-dsp" }
jk-format = { path = "../jk-format" }
jk-rubberband = { path = "../jk-rubberband" }
symphonia = { version = "0.6", default-features = false, features = ["flac"] }
rtrb = "0.4"
crossbeam-channel = "0.5.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
# STREAMINFO MD5 in the FLAC writer (jk-format's verifier requires it).
md-5 = "0.11.0"
# Demo-song generator: bit-reproducible sines (libm), the PNG cover (flate2, crc32fast).
libm = "0.2.16"
flate2 = "1.1.11"
crc32fast = "1.5.5"

[dev-dependencies]
hound = "3.5"

[target.'cfg(windows)'.dependencies]
wasapi = "0.27"

[target.'cfg(target_os = "macos")'.dependencies]
# 0.16, not 0.17+: newer cpal links macOS 14.2+ APIs (see src/output/coreaudio_out.rs).
cpal = "0.16"
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_System_Threading"]
