[package]
name = "jukeoke"
description = "Jukeoke desktop app: the Tauri 2 shell around the Rust core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Tauri 2.12 needs Rust 1.90 (the workspace default of 1.85 is too old for it).
# This also keeps Cargo's rust-version-aware resolver from picking old Tauri releases.
rust-version = "1.90"
default-run = "jukeoke"

# The library holds everything; the binary is a two-line wrapper. Separate names
# avoid an output-file collision between lib and bin on Windows.
[lib]
name = "jukeoke_lib"
crate-type = ["rlib"]

[[bin]]
name = "jukeoke"
path = "src/main.rs"
# main.rs is a two-line wrapper with no tests; building no test exe for it also keeps
# the Windows resource (manifest) from being linked twice (see build.rs).
test = false

[features]
default = ["custom-protocol"]
# Serve the built UI (app/ui/dist) from inside the executable. Without this feature
# the window loads the Vite dev server instead (tauri.conf.json build.devUrl);
# `npm run app:dev` in app/ui turns it off with --no-default-features.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }
serde_json = "1"
# Compiles native/webview2_loader.c on the Windows GNU target (see build.rs).
cc = "1.2"

[dependencies]
tauri = { version = "2.12.6", features = [] }
# Native file and folder pickers (pick_files, the macOS "choose the stick" picker),
# called from Rust only; the web UI gets no dialog permissions.
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Rust core's own crates.
jk-format = { path = "../../crates/jk-format" }
jk-engine = { path = "../../crates/jk-engine" }
jk-dsp = { path = "../../crates/jk-dsp" }
jk-recorder = { path = "../../crates/jk-recorder" }
# Work Order 2: the melody guide (builder + raw-copy rewrite, shared with jukeoke-cli).
jk-guide = { path = "../../crates/jk-guide" }
jk-pitch = { path = "../../crates/jk-pitch" }

# Engine events arrive on a crossbeam channel (the engine API); the clock thread
# selects over it with a timeout.
crossbeam-channel = "0.5.15"
# Library folder watcher (library://changed).
notify = "8.2.2"
# Cover thumbnails: decode JPEG / PNG and downscale. No other formats are compiled in.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# data: URLs for cover thumbnails.
base64 = "0.22.1"

# Windows only: WebView2 access for the smoke-test screenshot (src/screenshot.rs),
# the startup error dialog (MessageBoxW), OS version, memory and disk space queries,
# and write-through renames (src/fs_atomic.rs). Same versions as Tauri's own (wry),
# so the COM types are identical.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Wdk_System_SystemServices",
] }

# macOS only: the startup error dialog (NSAlert through rfd, the same crate the dialog
# plugin uses), sysctl / statvfs / task_info (memory, disk space, OS version), and
# NSBundle (WebKit.framework version for the self-check).
[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.17", default-features = false }
libc = "0.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSBundle", "NSDictionary", "NSString", "NSObject", "NSProcessInfo"] }

[dev-dependencies]
# Tests use temporary folders under std::env::temp_dir(). The guide tests compare chunks
# by SHA-256 (the version jk-dsp and jk-format already use).
sha2 = "0.11"
